[project]
name = "llm-stats-dashboard-backend"
version = "0.1.0"
description = "LLM Stats Dashboard – FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",        # signed session cookies
    "slowapi>=0.1.9",           # rate limiting
    "python-multipart>=0.0.20", # form bodies
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",              # proxy upstream client (async + streaming) + TestClient
    "respx>=0.22",               # mock httpx for proxy tests
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "ty>=0.0.1a9",
    "respx>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
env = ["LSD_TEST_MODE=1"]

[tool.ty]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest-env>=1.6.0",
]
